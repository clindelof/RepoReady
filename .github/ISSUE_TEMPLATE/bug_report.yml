name: Bug report
description: Report incorrect or unexpected RepoReady behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real secrets, private paths, or personal repository contents.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Use a minimal synthetic repository when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

