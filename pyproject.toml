[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repoready"
version = "0.2.0"
description = "A privacy-first preflight check for publishing Git repositories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Christopher Lindelof" }]
keywords = ["git", "security", "privacy", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
repoready = "repoready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
